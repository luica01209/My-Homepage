name: grep-status
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep statuses
        run: |
          echo "=== grep preprint/under review/accepted ==="
          grep -rin -E "preprint|under review|accepted|codeurl" --include="*.md" --include="*.yml" . | grep -v "_posts" || true
